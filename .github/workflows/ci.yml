name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    name: Test with React ${{ matrix.react-version.version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        react-version:
          - { name: "19", version: "^19.2.0" }
          - { name: "18", version: "^18.3.1" }
          - { name: "17", version: "^17.0.2" }
          - { name: "16", version: "^16.14.0" }

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4.0.1

      - name: Update React version
        run: node scripts/change_react_deps_version.cjs "${{ matrix.react-version.version }}"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
        env:
          # GitHub Actions appears to reach npm through a registry proxy that omits
          # the version "time" metadata required by pnpm's minimumReleaseAge check,
          # So we disable it in the test flow
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: 0

      - name: Run tests with coverage
        run: pnpm test --coverage

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage/lcov.info
          flag-name: react-${{ matrix.react-version.name }}
          parallel: true

  finish:
    name: Finish Coveralls
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
