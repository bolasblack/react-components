name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    name: Test with React ${{ matrix.react-version.version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        react-version:
          - { name: "19", version: "^19.2.0" }
          - { name: "18", version: "^18.3.1" }
          - { name: "17", version: "^17.0.2" }
          - { name: "16", version: "^16.14.0" }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Update React version
        run: node scripts/change_react_deps_version.cjs "${{ matrix.react-version.version }}"

      - name: Install dependencies
        run: pnpm install

      - name: Run tests with coverage
        run: pnpm test --coverage

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: react-${{ matrix.react-version.name }}
          parallel: true

  finish:
    name: Finish Coveralls
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
